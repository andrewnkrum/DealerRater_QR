<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Us a Review</title>

<!--
  =====================================================
  HOW TO USE THIS TEMPLATE
  =====================================================
  1. Edit the values in the CONFIG block below (employee
     name, title, dealership, and their DealerRater review URL).
  2. Save a copy of this file per co-worker, e.g.:
       review-card-john.html
       review-card-maria.html
  3. Open the file in a browser and tap "Add to Home Screen"
     (Safari: Share icon > Add to Home Screen) to get an
     app-like icon on iPhone.
  =====================================================
-->

<style>
  :root {
    --brand-color: #1a73e8;   /* EDIT: your dealership brand color */
    --text-color: #1d1d1f;
    --bg-color: #f5f5f7;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-color);
    padding: 24px;
  }

  .card {
    background: var(--card-bg);
    width: 100%;
    max-width: 380px;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }

  .dealership-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand-color);
    margin-bottom: 6px;
  }

  .headline {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .employee-name {
    font-size: 16px;
    font-weight: 500;
    color: #555;
    margin: 0 0 24px;
  }

  #qrcode {
    display: flex;
    justify-content: center;
    margin: 0 auto 20px;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #eee;
    width: fit-content;
  }

  .instructions {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .review-link {
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--brand-color);
    padding: 12px 24px;
    border-radius: 999px;
    text-decoration: none;
  }

  .review-link:active {
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="card">
  <div class="dealership-name" id="dealershipName">Your Dealership</div>
  <h1 class="headline">Enjoyed working with me?</h1>
  <p class="employee-name" id="employeeName">Employee Name</p>

  <div id="qrcode"></div>

  <p class="instructions">Scan the code or tap the button below to leave a quick review.</p>

  <a class="review-link" id="reviewLink" href="#" target="_blank" rel="noopener">Leave a Review</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // =====================================================
  // CONFIG — edit these three values for each co-worker
  // =====================================================
  const CONFIG = {
    dealershipName: "Lou Sobh Kia",                 // e.g. "Smith Family Motors"
    employeeName: "Andrew Krum",                      // e.g. "John Smith — Sales"
    reviewUrl: "https://www.dealerrater.com/YOUR-REVIEW-URL-HEREhttps://www.dealerrater.com/consumer/writereviews/105823?employeeId=980866&source=epp&"
  };
  // =====================================================

  document.getElementById('dealershipName').textContent = CONFIG.dealershipName;
  document.getElementById('employeeName').textContent = CONFIG.employeeName;
  document.getElementById('reviewLink').href = CONFIG.reviewUrl;

  new QRCode(document.getElementById("qrcode"), {
    text: CONFIG.reviewUrl,
    width: 200,
    height: 200,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>

</body>
</html>
